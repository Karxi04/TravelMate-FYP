steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'backend_api/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/travelmate-api:${_IMAGE_TAG}', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'operator_website/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/travelmate-operator:${_IMAGE_TAG}', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'admin_website/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/travelmate-admin:${_IMAGE_TAG}', '.']
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/travelmate-api:${_IMAGE_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/travelmate-operator:${_IMAGE_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/travelmate-admin:${_IMAGE_TAG}'
substitutions:
  _REGION: asia-southeast1
  _REPOSITORY: travelmate
  _IMAGE_TAG: manual
