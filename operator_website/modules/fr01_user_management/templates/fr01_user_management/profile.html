{% extends 'portal_base.html' %}{% block title %}Business Profile | TravelMate{% endblock %}{% block content %}<div class="page-title"><div><h1>Business Profile</h1><p>Manage own Tourism Operator profile.</p></div></div><form class="card" method="post" style="max-width:820px"><div class="grid g2"><div class="field"><label>Representative name</label><input class="input" name="name" value="{{ profile.get('name','') }}"></div><div class="field"><label>Company name</label><input class="input" name="companyName" value="{{ profile.get('companyName','') }}"></div><div class="field"><label>Business contact</label><input class="input" name="businessContact" value="{{ profile.get('businessContact','') }}"></div><div class="field"><label>Registration no.</label><input class="input" value="{{ profile.get('registrationNo','') }}" disabled></div></div><button class="btn primary">Save Profile</button></form>{% endblock %}
